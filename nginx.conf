user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Gzip Compression Optimization (OPS-13)
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html;

        # Security Headers (server-level fallback)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://us-assets.i.posthog.com https://eu-assets.i.posthog.com https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.themoviedb.org https://*.themoviedb.org https://image.tmdb.org https://images.unsplash.com https://s4.anilist.co https://graphql.anilist.co https://*.anilist.co https://cinemaos.tech https://hdhub.thevolecitor.qzz.io https://*.qzz.io https://opensubtitles-v3.strem.io https://*.strem.io https://*.opensubtitles.org https://opensubtitles.org https://pengu.uk https://*.pengu.uk https://pengu.lol https://*.workers.dev https://pixeldrain.dev https://pixeldrain.com https://*.pixeldrain.eu.cc https://player.cinezo.live https://*.cinezo.live https://cinezo.live https://framextv.xyz https://*.framextv.xyz https://framextv.cc https://*.framextv.cc https://flaxmovies.xyz https://*.flaxmovies.xyz https://vidy.st https://*.vidy.st https://www.vidy.st https://api.ppv.st https://*.ppv.st https://*.ppv.tj https://*.ppvs.pk https://*.ppv.rw https://*.ppv.ms https://*.ppv.bi https://*.ppv.ug https://us.i.posthog.com https://eu.i.posthog.com https://*.posthog.com https://us-assets.i.posthog.com https://eu-assets.i.posthog.com https://*.ingest.sentry.io https://*.sentry.io https://o0.ingest.sentry.io blob: data:; frame-src 'self' https://vidy.st https://*.vidy.st https://www.vidy.st https://player.cinezo.live https://*.cinezo.live https://cinezo.live https://framextv.xyz https://*.framextv.xyz https://framextv.cc https://*.framextv.cc https://flaxmovies.xyz https://*.flaxmovies.xyz https://taifood-blog.asia https://*.taifood-blog.asia https://*.asia https://megaplay.buzz https://cinemaos.tech https://vidsrc.sh https://player.videasy.to https://vidfast.vc https://vidlux.xyz https://player.vidlove.cc https://vidrock.net https://mappletv.uk https://vixsrc.to https://www.youtube.com https://youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" always;

        # Healthcheck endpoint
        location /healthz {
            access_log off;
            default_type text/plain;
            return 200 'OK';
        }

        # Media reverse proxy to Cloudflare Worker
        location /api/media/ {
            proxy_pass https://lively-bar-b4aa.anuraagsingh10a.workers.dev/api/media/;
            proxy_set_header Host lively-bar-b4aa.anuraagsingh10a.workers.dev;
            proxy_ssl_server_name on;
        }

        # Immutable static assets caching (Vite generates content-hashed assets)
        location ~* \.(?:css(\.map)?|js(\.map)?|woff2?|ttf|eot|wasm)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # Media and image caching
        location ~* \.(?:jpe?g|png|gif|ico|webp|avif|svg)$ {
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # Subtitle files
        location ~* \.(?:vtt|srt)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header Access-Control-Allow-Origin "*";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # Single Page Application (SPA) routing fallback
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://us-assets.i.posthog.com https://eu-assets.i.posthog.com https://*.posthog.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://api.themoviedb.org https://*.themoviedb.org https://image.tmdb.org https://images.unsplash.com https://s4.anilist.co https://graphql.anilist.co https://*.anilist.co https://cinemaos.tech https://hdhub.thevolecitor.qzz.io https://*.qzz.io https://opensubtitles-v3.strem.io https://*.strem.io https://*.opensubtitles.org https://opensubtitles.org https://pengu.uk https://*.pengu.uk https://pengu.lol https://*.workers.dev https://pixeldrain.dev https://pixeldrain.com https://*.pixeldrain.eu.cc https://player.cinezo.live https://*.cinezo.live https://cinezo.live https://framextv.xyz https://*.framextv.xyz https://framextv.cc https://*.framextv.cc https://flaxmovies.xyz https://*.flaxmovies.xyz https://vidy.st https://*.vidy.st https://www.vidy.st https://api.ppv.st https://*.ppv.st https://*.ppv.tj https://*.ppvs.pk https://*.ppv.rw https://*.ppv.ms https://*.ppv.bi https://*.ppv.ug https://us.i.posthog.com https://eu.i.posthog.com https://*.posthog.com https://us-assets.i.posthog.com https://eu-assets.i.posthog.com https://*.ingest.sentry.io https://*.sentry.io https://o0.ingest.sentry.io blob: data:; frame-src 'self' https://vidy.st https://*.vidy.st https://www.vidy.st https://player.cinezo.live https://*.cinezo.live https://cinezo.live https://framextv.xyz https://*.framextv.xyz https://framextv.cc https://*.framextv.cc https://flaxmovies.xyz https://*.flaxmovies.xyz https://taifood-blog.asia https://*.taifood-blog.asia https://*.asia https://megaplay.buzz https://cinemaos.tech https://vidsrc.sh https://player.videasy.to https://vidfast.vc https://vidlux.xyz https://player.vidlove.cc https://vidrock.net https://mappletv.uk https://vixsrc.to https://www.youtube.com https://youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" always;
        }

        # Custom error page
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
