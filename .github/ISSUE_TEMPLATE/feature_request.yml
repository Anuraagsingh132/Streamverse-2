name: ✨ Feature Request
description: Suggest an idea or enhancement for Streamverse
title: "[FEATURE]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea or feature! Tell us what you'd like to see in Streamverse.
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? Please describe it.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution or Idea
      description: Describe the solution you'd like to see implemented.
      placeholder: "Add an option to..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false
  - type: textarea
    id: mockups
    attributes:
      label: Mockups or References
      description: Share any design mockups, drawings, or links to similar implementations in other apps.
    validations:
      required: false
  - type: checkboxes
    id: willing-to-pr
    attributes:
      label: Willing to Contribute
      description: Would you be interested in submitting a pull request to implement this feature?
      options:
        - label: I would like to submit a Pull Request for this feature
