<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Streamverse" />
    <meta name="application-name" content="Streamverse" />
    <meta name="msapplication-TileColor" content="#000000" />
    <title>Streamverse - Watch Movies, Anime, TV Shows & Live Sports</title>
    <meta name="description" content="Beautifully designed website where you can watch anime, drama, movies and live sports. Built with React, TypeScript and Tailwind CSS." />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Streamverse" />
    <meta property="og:title" content="Streamverse - Watch Movies, Anime, TV Shows & Live Sports" />
    <meta property="og:description" content="Beautifully designed website where you can watch anime, drama, movies and live sports. Built with React, TypeScript and Tailwind CSS." />
    <meta property="og:url" content="https://streamverse.app" />
    <meta property="og:image" content="https://streamverse.app/apple-touch-icon.png" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Streamverse - Watch Movies, Anime, TV Shows & Live Sports" />
    <meta name="twitter:description" content="Beautifully designed website where you can watch anime, drama, movies and live sports. Built with React, TypeScript and Tailwind CSS." />
    <meta name="twitter:image" content="https://streamverse.app/apple-touch-icon.png" />

    <!-- Performance Resource Hints: Targeted preconnects (image CDNs) -->
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />
    <link rel="dns-prefetch" href="https://graphql.anilist.co" />
    <link rel="dns-prefetch" href="https://s4.anilist.co" />

    <!-- Critical Font Preload (Eliminates Render-Blocking Chain Delay) -->
    <link rel="preload" href="/media/36966cca54120369-s.p.woff2" as="font" type="font/woff2" crossorigin />

    <!-- High-Priority LCP Hero Backdrop Preload (Instant Discovery for Top Trending Slide) -->
    <link rel="preload" as="image" href="https://image.tmdb.org/t/p/w780/8WGq5Q0tmTe30YZetLnU2dkOJZf.jpg" media="(max-width: 640px)" fetchpriority="high" />
    <link rel="preload" as="image" href="https://image.tmdb.org/t/p/w1280/8WGq5Q0tmTe30YZetLnU2dkOJZf.jpg" media="(min-width: 641px)" fetchpriority="high" />
  </head>
  <body class="bg-[#000000] text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
